<div class="stack" aria-live="polite">
  @for (notice of notices(); track notice.id) {
    <div class="toast" [class]="'toast ' + notice.kind" role="status">
      <p>{{ notice.message }}</p>
      <button
        type="button"
        class="cerrar"
        aria-label="Cerrar aviso"
        (click)="dismiss(notice.id)"
      >
        ×
      </button>
    </div>
  }
</div>
