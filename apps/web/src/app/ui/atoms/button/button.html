<button
  [class]="classes()"
  [attr.type]="type()"
  [attr.aria-label]="ariaLabel()"
  [attr.aria-busy]="loading() ? 'true' : null"
  [attr.data-variant]="variant()"
  [attr.data-size]="size()"
  [disabled]="disabled() || loading()"
>
  @if (loading()) {
    <span
      class="size-4 animate-spin rounded-full border-2 border-current border-t-transparent"
      aria-hidden="true"
    ></span>
  }
  <ng-content />
</button>
