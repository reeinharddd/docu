<header
  class="flex items-center justify-between gap-6 border-b border-line bg-surface px-6 py-4"
>
  <a
    routerLink="/capture"
    class="font-logo text-xl font-bold tracking-tight text-brand-text no-underline"
    aria-label="docu, inicio"
    data-test="wordmark"
  >
    doc<span class="text-accent-600" data-test="wordmark-accent">u</span>
  </a>
  <nav class="flex gap-2" aria-label="Navegación principal">
    @for (item of nav(); track item.href) {
      <a
        [routerLink]="item.href"
        routerLinkActive="bg-brand-soft text-brand-text"
        class="inline-flex items-center rounded-md px-3.5 py-2 font-medium text-ink-2 no-underline hover:bg-brand-soft"
      >
        {{ item.label }}
      </a>
    }
  </nav>
</header>

<main class="mx-auto w-full max-w-5xl flex-1 px-6 py-6">
  <router-outlet />
</main>

<app-toasts />
