# DOCU E1 — base environment. Data services today; api/worker connect in M1/E2.
name: docu
services:
  db:
    image: pgvector/pgvector:pg18
    container_name: docu-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: docu
      POSTGRES_PASSWORD: docu
      POSTGRES_DB: docu
    ports:
      - "${PG_PORT:-5432}:5432"
    volumes:
      - docu_pgdata:/var/lib/postgresql
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U docu -d docu"]
      interval: 5s
      retries: 10
  redis:
    image: redis:8
    container_name: docu-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - docu_redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10
  # IA engines host (REPLAN-2026-10-30 lane C): one OpenAI-compatible endpoint
  # for OCR, LLM and embeddings (ADR-0020). Models are pulled by
  # scripts/setup-ia.sh, never baked into the app image.
  ollama:
    image: ollama/ollama:latest
    container_name: docu-ollama
    restart: unless-stopped
    ports:
      - "${IA_OLLAMA_PORT:-11434}:11434"
    volumes:
      - docu_ollama:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 5s
      retries: 12
  # api:      # M1 — build: ../apps/api, port 3000, depends on healthy db+redis
  # worker:   # E2 — same api image, worker command (BullMQ + tesseract inside)
volumes:
  docu_pgdata:
  docu_redisdata:
  docu_ollama:
