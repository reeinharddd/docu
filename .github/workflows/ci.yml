name: ci
on:
  push:
    branches: [main]
    paths:
      - "apps/**"
      - "infra/**"
      - "docs/**"
      - "scripts/**"
      - ".github/**"
      - "*.json"
      - "*.yml"
      - "*.sh"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "biome.json"
  pull_request:
    paths:
      - "apps/**"
      - "infra/**"
      - "docs/**"
      - "scripts/**"
      - ".github/**"
      - "*.json"
      - "*.yml"
      - "*.sh"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "biome.json"
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  guardas:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://docu:docu@localhost:5432/docu?schema=public
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install
      - run: test ! -f .env || (echo ".env en el repo" && exit 1)
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: bun run lint
      - run: bun run typecheck
      - run: docker compose -f infra/docker-compose.yml config
      - run: bash scripts/doc-index.sh
      - run: bun run harness:check
      - run: bash scripts/docs-linkcheck.sh
      - run: bash scripts/docs-briefcheck.sh
      - run: bash scripts/docs-tracecheck.sh
      - run: bun --filter web test
  smoke:
    needs: guardas
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: docu
          POSTGRES_PASSWORD: docu
          POSTGRES_DB: docu
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U docu -d docu"
          --health-interval 5s
          --health-retries 10
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://docu:docu@localhost:5432/docu?schema=public
      REDIS_URL: redis://localhost:6379
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - run: bun install
      # El smoke usa el mismo script que local: espera por condicion, no por
      # tiempo fijo, y distingue "la API no levanta" de "falta infraestructura".
      - run: bash scripts/smoke-api.sh
      - run: bun scripts/queue-ping.ts
        working-directory: apps/api
