name: pr-issue
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
permissions:
  contents: read
  pull-requests: read
jobs:
  enlace:
    runs-on: ubuntu-latest
    steps:
      - name: The PR closes an issue or carries the sin-issue label
        env:
          BODY: ${{ github.event.pull_request.body }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if printf '%s' "$BODY" | grep -Eiq '(closes|fixes|resolves|cierra) #[0-9]+'; then
            echo "PR enlazado a issue."
          elif printf '%s' "$LABELS" | grep -q 'sin-issue'; then
            echo "::notice::PR without issue, marked with sin-issue."
          else
            echo "::error::PR body must say 'Closes #N' (RULE 7) or carry the sin-issue label."
            exit 1
          fi
