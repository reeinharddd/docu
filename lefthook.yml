pre-commit:
  parallel: true
  commands:
    biome:
      glob: "*.{js,ts,json,css}"
      run: biome check --write --staged
    no-secretos:
      run: ./noventa-secretos.sh
    diagramas:
      glob: "*.{md,mmd,drawio}"
      run: bun scripts/diagramas-check.ts
commit-msg:
  commands:
    formato:
      run: ./commit-msg.sh "{1}"
